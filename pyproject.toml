[project]
name = "n26-tax-calculator"
version = "1.0.0"
description = "Simple N26 tax report generator for French taxpayers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "ipython>=9.13.0",
    "ocrmac>=1.0.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    #"werkzeug==3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "black>=26.5.1", "flake8>=7.3.0", "openpyxl>=3.1.5", "pandas>=3.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "core", "utils"]
